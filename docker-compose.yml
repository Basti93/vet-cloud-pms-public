version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vet-cloud-pms-postgres
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: neondb
    ports:
      - "5432:6432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
