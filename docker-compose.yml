version: '3.8'

# Local development database — matches production schema.
# Start with: docker compose up -d
# Stop with:  docker compose down
# Wipe data:  docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: vet-cloud-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vetcloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetcloud -d vetcloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: vet-cloud-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI — http://localhost:8025
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
